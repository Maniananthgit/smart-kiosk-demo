name: Deploy Flutter Demo to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Enable Flutter Web & Install Dependencies
        working-directory: ./frontend
        run: |
          flutter config --enable-web
          flutter pub get

      - name: Build Flutter Web App
        working-directory: ./frontend
        run: |
          flutter build web --release --base-href "/smart-kiosk-demo/" --no-tree-shake-icons

      - name: Copy index.html to 404.html for GoRouter routing
        run: |
          cp frontend/build/web/index.html frontend/build/web/404.html

      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./frontend/build/web

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
